<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Daftar - X TKRO 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://files.catbox.moe/xcsjiz.png" type="image/png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a5fb4;
            --secondary-color: #e95420;
            --accent-color: #f2a900;
            --dark-color: #333;
            --gray-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --border-radius: 10px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
        }

        .register-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-header {
            background: linear-gradient(135deg, var(--primary-color), #0d3d8c);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .register-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 15px;
        }

        .register-header h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .register-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .register-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            background: #0d3d8c;
            transform: translateY(-2px);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: var(--dark-color);
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .google-btn:hover {
            border-color: var(--primary-color);
            background: rgba(26, 95, 180, 0.05);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--gray-color);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }
        .divider span {
            margin: 0 10px;
            font-size: 0.85rem;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: #f8d7da;
            color: var(--danger-color);
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: var(--success-color);
            border: 1px solid #c3e6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .username-modal {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .username-modal {
            transform: scale(1);
        }

        .username-modal h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .username-modal p {
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--gray-color);
        }

        .username-modal input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .username-modal button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <img src="https://files.catbox.moe/xcsjiz.png" alt="Logo">
                <h2>Daftar Akun Baru</h2>
                <p>Bergabung dengan Kelas X TKRO 5</p>
            </div>
            <div class="register-body">
                <div id="alertBox" class="alert"></div>
                
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Nama Depan</label>
                            <input type="text" id="firstName" placeholder="Nama depan" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Nama Belakang</label>
                            <input type="text" id="lastName" placeholder="Nama belakang">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Nama Panggilan / Username</label>
                        <input type="text" id="username" placeholder="contoh: raimift" required>
                        <small style="color: var(--gray-color);">Nama unik yang akan ditampilkan di chat</small>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-venus-mars"></i> Jenis Kelamin</label>
                            <select id="gender">
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-calendar"></i> Kelas</label>
                            <select id="kelas">
                                <option value="X TKRO 5">X TKRO 5</option>
                                <option value="X TKRO 1">X TKRO 1</option>
                                <option value="X TKRO 2">X TKRO 2</option>
                                <option value="X TKRO 3">X TKRO 3</option>
                                <option value="X TKRO 4">X TKRO 4</option>
                                <option value="Guru">Guru / Staff</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" placeholder="contoh@email.com" required>
                        <small style="color: var(--gray-color);">Email akan digunakan untuk login</small>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fab fa-whatsapp"></i> Nomor WhatsApp (opsional)</label>
                        <input type="tel" id="phone" placeholder="08xxxxxxxxxx">
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" placeholder="Minimal 6 karakter" required>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Konfirmasi Password</label>
                        <input type="password" id="confirmPassword" placeholder="Ulangi password" required>
                    </div>
                    
                    <button type="submit" class="register-btn" id="registerBtn">
                        <i class="fas fa-user-plus"></i> Daftar dengan Email
                    </button>
                </form>

                <div class="divider">
                    <span>atau</span>
                </div>

                <button class="google-btn" id="googleRegisterBtn">
                    <i class="fab fa-google"></i> Daftar dengan Google
                </button>

                <div class="login-link">
                    <p>Sudah punya akun? <a href="login.html">Login Sekarang</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Username untuk Google -->
    <div class="modal-overlay" id="usernameModal">
        <div class="username-modal">
            <h3><i class="fas fa-user-tag"></i> Pilih Nama Panggilan</h3>
            <p>Masukkan username yang akan ditampilkan di chat (tanpa password)</p>
            <input type="text" id="googleUsername" placeholder="Nama panggilan / username" autocomplete="off">
            <button id="submitUsernameBtn">Lanjutkan</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-jP9F82EcaCAvQ87-JAuErkd7DdbWbjA",
            authDomain: "rayy-all-web.firebaseapp.com",
            databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rayy-all-web",
            storageBucket: "rayy-all-web.firebasestorage.app",
            messagingSenderId: "491699101144",
            appId: "1:491699101144:web:7d9976eb6b16d66f56a6ad"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        let pendingGoogleUser = null;

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            setTimeout(() => alertBox.classList.remove('show'), 5000);
        }

        async function isUsernameAvailable(username) {
            const snapshot = await db.collection('users').where('username', '==', username.toLowerCase()).get();
            return snapshot.empty;
        }

        async function createUserWithEmail(firstName, lastName, username, gender, kelas, email, phone, password) {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
            const fullName = lastName ? `${firstName} ${lastName}` : firstName;
            
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                firstName: firstName,
                lastName: lastName,
                fullName: fullName,
                displayName: username.toLowerCase(),
                username: username.toLowerCase(),
                gender: gender,
                kelas: kelas,
                email: email,
                phone: phone || '',
                profilePic: `https://ui-avatars.com/api/?background=1a5fb4&color=fff&name=${encodeURIComponent(firstName[0]) + (lastName ? lastName[0] : '')}`,
                bio: `Siswa ${kelas} - SMKN 6 Bandung`,
                isAdmin: false,
                isOnline: false,
                createdAt: Date.now(),
                lastActive: Date.now(),
                sekolah: 'SMKN 6 Bandung',
                authProvider: 'email'
            });
            
            await auth.signOut();
            return true;
        }

        async function createUserWithGoogle(user, username, gender, kelas, phone) {
            const firstName = user.displayName ? user.displayName.split(' ')[0] : 'User';
            const lastName = user.displayName && user.displayName.split(' ')[1] ? user.displayName.split(' ')[1] : '';
            const fullName = user.displayName || 'User';
            
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                firstName: firstName,
                lastName: lastName,
                fullName: fullName,
                displayName: username.toLowerCase(),
                username: username.toLowerCase(),
                gender: gender,
                kelas: kelas,
                email: user.email,
                phone: phone || '',
                profilePic: user.photoURL || `https://ui-avatars.com/api/?background=1a5fb4&color=fff&name=${encodeURIComponent(firstName[0])}`,
                bio: `Siswa ${kelas} - SMKN 6 Bandung`,
                isAdmin: false,
                isOnline: false,
                createdAt: Date.now(),
                lastActive: Date.now(),
                sekolah: 'SMKN 6 Bandung',
                authProvider: 'google'
            });
            
            return true;
        }

        // Register dengan Email/Password
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const gender = document.getElementById('gender').value;
            const kelas = document.getElementById('kelas').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!firstName) { showAlert('Nama depan harus diisi!', 'error'); return; }
            if (!username) { showAlert('Nama panggilan harus diisi!', 'error'); return; }
            if (username.length < 3) { showAlert('Nama panggilan minimal 3 karakter!', 'error'); return; }
            if (!email) { showAlert('Email harus diisi!', 'error'); return; }
            if (password !== confirmPassword) { showAlert('Password tidak cocok!', 'error'); return; }
            if (password.length < 6) { showAlert('Password minimal 6 karakter!', 'error'); return; }
            
            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mendaftar...';
            
            try {
                if (!await isUsernameAvailable(username)) {
                    showAlert('Username sudah dipakai! Coba yang lain.', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar dengan Email';
                    return;
                }
                
                await createUserWithEmail(firstName, lastName, username, gender, kelas, email, phone, password);
                showAlert('Pendaftaran berhasil! Silakan login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (error) {
                console.error(error);
                let errorMessage = 'Pendaftaran gagal. Silakan coba lagi.';
                if (error.code === 'auth/email-already-in-use') errorMessage = 'Email sudah digunakan.';
                else if (error.code === 'auth/invalid-email') errorMessage = 'Format email tidak valid.';
                else if (error.code === 'auth/weak-password') errorMessage = 'Password terlalu lemah.';
                showAlert(errorMessage, 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar dengan Email';
            }
        });

        // Register dengan Google
        document.getElementById('googleRegisterBtn').addEventListener('click', async () => {
            const googleBtn = document.getElementById('googleRegisterBtn');
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Cek apakah user sudah terdaftar
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (userDoc.exists) {
                    // User sudah ada, langsung login
                    showAlert('Akun sudah terdaftar! Mengalihkan ke login...', 'success');
                    await auth.signOut();
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    // User baru, minta username
                    pendingGoogleUser = user;
                    document.getElementById('usernameModal').classList.add('show');
                    document.getElementById('googleUsername').value = user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                }
            } catch (error) {
                console.error(error);
                showAlert('Gagal: ' + error.message, 'error');
                googleBtn.disabled = false;
                googleBtn.innerHTML = '<i class="fab fa-google"></i> Daftar dengan Google';
            }
        });

        // Submit username untuk Google user
        document.getElementById('submitUsernameBtn').addEventListener('click', async () => {
            const username = document.getElementById('googleUsername').value.trim().toLowerCase();
            const gender = document.getElementById('gender').value;
            const kelas = document.getElementById('kelas').value;
            const phone = document.getElementById('phone').value.trim();
            
            if (!username) {
                showAlert('Username harus diisi!', 'error');
                return;
            }
            if (username.length < 3) {
                showAlert('Username minimal 3 karakter!', 'error');
                return;
            }
            if (!await isUsernameAvailable(username)) {
                showAlert('Username sudah dipakai! Coba yang lain.', 'error');
                return;
            }
            
            if (!pendingGoogleUser) {
                showAlert('Error: Silakan coba lagi.', 'error');
                document.getElementById('usernameModal').classList.remove('show');
                return;
            }
            
            const submitBtn = document.getElementById('submitUsernameBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            
            try {
                await createUserWithGoogle(pendingGoogleUser, username, gender, kelas, phone);
                await auth.signOut();
                showAlert('Pendaftaran berhasil! Silakan login.', 'success');
                document.getElementById('usernameModal').classList.remove('show');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (error) {
                console.error(error);
                showAlert('Gagal menyimpan data: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Lanjutkan';
            }
        });

        // Modal close dengan klik overlay
        document.getElementById('usernameModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('usernameModal')) {
                document.getElementById('usernameModal').classList.remove('show');
                if (pendingGoogleUser) {
                    auth.signOut();
                    pendingGoogleUser = null;
                }
            }
        });
    </script>
</body>
</html>
