<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>X TKRO 5 - SMKN 6 Bandung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://files.catbox.moe/xcsjiz.png" type="image/png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a5fb4;
            --secondary-color: #e95420;
            --accent-color: #f2a900;
            --dark-color: #333333;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --border-radius: 10px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: #f5f7fa;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background-color: white;
            box-shadow: var(--shadow);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 10px 0;
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: 1.3rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .logo-text p {
            font-size: 0.7rem;
            color: var(--gray-color);
        }

        /* User Menu */
        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--primary-color);
        }

        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 220px;
            display: none;
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--dark-color);
            transition: var(--transition);
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            background: white;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .dropdown-item:hover {
            background-color: rgba(26, 95, 180, 0.1);
        }

        .dropdown-item i {
            width: 20px;
            color: var(--primary-color);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 20px 0;
        }

        /* Welcome Section */
        .welcome-section {
            background: linear-gradient(135deg, var(--primary-color), #0d3d8c);
            border-radius: var(--border-radius);
            padding: 30px;
            color: white;
            margin-bottom: 30px;
        }

        .welcome-section h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .welcome-section p {
            opacity: 0.9;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--dark-color);
            box-shadow: var(--shadow);
            display: block;
        }

        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .action-card i {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .action-card span {
            font-weight: 500;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .info-card i {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .info-card h3 {
            font-size: 2rem;
            color: var(--primary-color);
        }

        /* Announcement */
        .announcement-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .announcement-card h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            padding-left: 12px;
        }

        .announcement-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .announcement-date {
            font-size: 0.7rem;
            color: var(--gray-color);
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            background: var(--dark-color);
            color: white;
            padding: 30px 0;
            text-align: center;
            margin-top: 40px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success-color);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 768px) {
            .user-name { display: inline; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://files.catbox.moe/xcsjiz.png" alt="Logo">
                <div class="logo-text">
                    <h1>X TKRO 5</h1>
                    <p>SMKN 6 BANDUNG</p>
                </div>
            </div>
            <div class="user-menu">
                <span class="user-name" id="userName">Loading...</span>
                <img id="userAvatar" class="user-avatar" src="https://ui-avatars.com/api/?background=1a5fb4&color=fff&name=User" alt="Avatar">
                <div class="dropdown-menu" id="dropdownMenu">
                    <button class="dropdown-item" onclick="goToProfile()"><i class="fas fa-user"></i> Profil Saya</button>
                    <button class="dropdown-item" onclick="goToChatRoom()"><i class="fas fa-comments"></i> Chat Kelas</button>
                    <button class="dropdown-item" onclick="goToChatPrivate()"><i class="fas fa-lock"></i> Chat Private</button>
                    <button class="dropdown-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="welcome-section">
                <h2 id="welcomeMsg">Selamat Datang!</h2>
                <p>Website resmi Kelas X TKRO 5 - SMKN 6 Bandung</p>
            </div>

            <div class="quick-actions">
                <button class="action-card" onclick="goToChatRoom()"><i class="fas fa-comments"></i><span>Chat Kelas</span></button>
                <button class="action-card" onclick="goToChatPrivate()"><i class="fas fa-lock"></i><span>Chat Private</span></button>
                <button class="action-card" onclick="goToProfile()"><i class="fas fa-user-edit"></i><span>Edit Profil</span></button>
            </div>

            <div class="info-grid">
                <div class="info-card"><i class="fas fa-users"></i><h3 id="totalStudents">38</h3><p>Siswa</p></div>
                <div class="info-card"><i class="fas fa-chalkboard-user"></i><h3 id="totalTeachers">15</h3><p>Guru</p></div>
                <div class="info-card"><i class="fas fa-calendar-alt"></i><h3>8</h3><p>Jurusan</p></div>
            </div>

            <div class="announcement-card">
                <h3><i class="fas fa-bullhorn"></i> Pengumuman Terbaru</h3>
                <div id="announcementContent"><p>Memuat...</p></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Kelas X TKRO 5 - SMKN 6 Bandung</p>
            <p style="font-size: 0.8rem; opacity: 0.7;">Built with <i class="fas fa-heart"></i> by X TKRO 5</p>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-jP9F82EcaCAvQ87-JAuErkd7DdbWbjA",
            authDomain: "rayy-all-web.firebaseapp.com",
            databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rayy-all-web",
            storageBucket: "rayy-all-web.firebasestorage.app",
            messagingSenderId: "491699101144",
            appId: "1:491699101144:web:7d9976eb6b16d66f56a6ad"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('deviceId');
            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('deviceId', deviceId);
            }
            return deviceId;
        }

        function goToProfile() { window.location.href = 'profile.html'; }
        function goToChatRoom() { window.location.href = 'chat-room.html'; }
        function goToChatPrivate() { window.location.href = 'chat-private.html'; }

        async function loadUserData(user) {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                const data = userDoc.data();
                document.getElementById('userName').textContent = data.displayName || data.fullName;
                document.getElementById('welcomeMsg').textContent = `Halo, ${data.displayName || data.fullName}!`;
                if (data.profilePic) document.getElementById('userAvatar').src = data.profilePic;
            }
        }

        async function loadAnnouncement() {
            const snap = await rtdb.ref('announcements').orderByChild('timestamp').limitToLast(1).once('value');
            const data = snap.val();
            if (data) {
                const latest = Object.values(data)[0];
                document.getElementById('announcementContent').innerHTML = `
                    <div class="announcement-title">${latest.title}</div>
                    <div class="announcement-date">${new Date(latest.timestamp).toLocaleDateString('id-ID')}</div>
                    <p>${latest.content}</p>
                `;
            } else {
                document.getElementById('announcementContent').innerHTML = '<p>Belum ada pengumuman</p>';
            }
        }

        // Dropdown
        const avatar = document.getElementById('userAvatar');
        const dropdown = document.getElementById('dropdownMenu');
        avatar.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
        document.addEventListener('click', () => dropdown.classList.remove('show'));

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm('Yakin logout?')) {
                const user = auth.currentUser;
                if (user) {
                    await rtdb.ref(`sessions/${user.uid}`).remove();
                    await db.collection('users').doc(user.uid).update({ isOnline: false });
                }
                await auth.signOut();
                localStorage.removeItem('deviceId');
                window.location.href = 'login.html';
            }
        });

        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const deviceId = getDeviceId();
                const session = await rtdb.ref(`sessions/${user.uid}`).once('value');
                if (!session.exists() || session.val().deviceId !== deviceId) {
                    await auth.signOut();
                    window.location.href = 'login.html';
                    return;
                }
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().isAdmin === true) {
                    window.location.href = 'admin.html';
                    return;
                }
                await loadUserData(user);
                await loadAnnouncement();
                await db.collection('users').doc(user.uid).update({ isOnline: true, lastActive: Date.now() });
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
